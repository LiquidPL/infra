apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - secret.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: glance
  - includeTemplates: true
    pairs:
      app.kubernetes.io/version: v0.8.4
images:
  - name: docker.io/glanceapp/glance
    newTag: v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
configMapGenerator:
  - name: glance
    options:
      disableNameSuffixHash: true
    files:
      - ./config/glance.yml
      - ./config/home.yml
