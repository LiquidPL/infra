apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - secret.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: glance
  - includeTemplates: true
    pairs:
      app.kubernetes.io/version: v0.8.4
images:
  - name: docker.io/glanceapp/glance
    newTag: v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
configMapGenerator:
  - name: glance
    options:
      disableNameSuffixHash: true
    files:
      - ./config/glance.yml
      - ./config/home.yml
