apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - secret.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: glance
  - includeTemplates: true
    pairs:
      app.kubernetes.io/version: v0.8.4
images:
  - name: docker.io/glanceapp/glance
    newTag: v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
configMapGenerator:
  - name: glance
    options:
      disableNameSuffixHash: true
    files:
      - ./config/glance.yml
      - ./config/home.yml
